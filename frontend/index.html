<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>曙光教育 3.0</title>
<meta name="description" content="選擇你的版本：電腦/平板，或手機。">
<link rel="stylesheet" href="assets/css/base.css?v=3.0.0">
<style>
  #chooser { min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; }
  .ch-half {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-6);
    padding: var(--sp-12); text-decoration: none; overflow: hidden;
    transition: flex .4s var(--ease);
  }
  .ch-half::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .ch-desktop::before { background: url("assets/img/home-zen-bg.webp") center / cover; opacity: .45; }
  .ch-mobile::before { background: url("assets/img/home-neon-bg.webp") center / cover; opacity: .55; }
  .ch-half > * { position: relative; }
  .ch-desktop { background: #F4EFE6; color: #2B2620; }
  .ch-mobile { background: #0B0E2A; color: #EAF6FF; }
  .ch-half:hover { flex: 1.15; }
  .ch-half h2 { font-size: var(--fs-32); letter-spacing: .15em; }
  .ch-half p { opacity: .7; font-size: var(--fs-14); }
  .ch-img { width: 160px; height: 160px; object-fit: cover; border-radius: 50%; border: 3px solid currentColor; opacity: .95; }
  .ch-logo {
    position: absolute; top: var(--sp-8); left: 50%; transform: translateX(-50%);
    z-index: 2; text-align: center; pointer-events: none;
  }
  .ch-logo h1 { font-size: var(--fs-24); letter-spacing: .3em; color: #2B2620; mix-blend-mode: multiply; }
  @media (max-width: 768px) {
    #chooser { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .ch-half:hover { flex: 1; }
  }
</style>
</head>
<body>
<div class="ch-logo"><h1>曙光教育</h1></div>
<div id="chooser" role="main">
  <a class="ch-half ch-desktop" href="desktop.html" aria-label="進入電腦平板版">
    <img class="ch-img" src="assets/img/chooser-desktop.webp?v=3.0.0" alt="電腦版插圖：水墨筆電與山水">
    <h2>電腦 / 平板</h2>
    <p>左右分屏 · 左岸靜修右岸星海</p>
  </a>
  <a class="ch-half ch-mobile" href="mobile.html" aria-label="進入手機版">
    <img class="ch-img" src="assets/img/chooser-mobile.webp?v=3.0.0" alt="手機版插圖：深空中的手機">
    <h2>手機</h2>
    <p>上下分屏 · 單手可及</p>
  </a>
</div>
</body>
</html>
