<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>曙光教育 3.0</title>
<meta name="description" content="遊戲化適性學習：左岸靜修，右岸星海。">
<link rel="stylesheet" href="assets/css/base.css?v=3.0.0">
<link rel="stylesheet" href="assets/css/pages/home.css?v=3.0.0">
</head>
<body>
<div id="gateway">
  <!-- 左：禪區 -->
  <section class="zone-learn theme-zen" aria-label="學習區">
    <main>
      <p class="zone-sub">左岸 · 靜修</p>
      <h1 class="zone-title">學習</h1>
      <p class="zone-sub">刪除干擾，進入專注。點一枚徽章，進入那個世界。</p>
      <div class="sys-grid">
        <a class="card sys-card" href="pages/quiz.html">
          <img src="assets/img/emblem-quiz.webp?v=3.0.0" alt="試煉徽章：卷軸與朱印" loading="lazy">
          <h3>費曼戰役</h3><p>解釋 · 辯論 · 授勳</p>
        </a>
        <a class="card sys-card" href="pages/mastery.html">
          <img src="assets/img/emblem-mastery.webp?v=3.0.0" alt="掌握度徽章" loading="lazy">
          <h3>掌握度</h3><p>主題進度 · 弱項提醒</p>
        </a>
        <a class="card sys-card" href="pages/favorites.html">
          <img src="assets/img/emblem-favorites.webp?v=3.0.0" alt="收藏徽章：藏書閣" loading="lazy">
          <h3>藏書閣</h3><p>知識湖 · 收藏</p>
        </a>
        <a class="card sys-card" href="pages/bookshelf.html">
          <img src="assets/img/emblem-bookshelf.webp?v=3.0.0" alt="書架徽章" loading="lazy">
          <h3>我的書架</h3><p>個人化課本 · 戰績</p>
        </a>
        <a class="card sys-card" href="pages/review.html">
          <img src="assets/img/emblem-review.webp?v=3.0.0" alt="複習徽章：沙漏與卷軸" loading="lazy">
          <h3>複習任務</h3><p>間隔重複 · 不遺忘</p>
        </a>
      </div>
    </main>
  </section>

  <!-- 中線：墨水分界河 -->
  <div id="ink-river" aria-hidden="true"></div>

  <!-- 右：霓虹區 -->
  <section class="zone-game theme-neon" aria-label="遊戲區">
    <main>
      <p class="zone-sub">右岸 · 星海</p>
      <h1 class="zone-title">遊戲</h1>
      <p class="zone-sub">指揮官，你的艦隊在等你。</p>
      <div class="sys-grid">
        <a class="card sys-card" href="pages/island.html">
          <img src="assets/img/emblem-island.webp?v=3.0.0" alt="島嶼徽章：浮空島" loading="lazy">
          <h3>島嶼世界</h3><p>開疆 · 建設 · 佔領</p>
        </a>
        <a class="card sys-card" href="pages/explore.html">
          <img src="assets/img/emblem-explore.webp?v=3.0.0" alt="探索徽章" loading="lazy">
          <h3>探索冒險</h3><p>劇情 · 選擇 · 獎勵</p>
        </a>
        <a class="card sys-card" href="pages/market.html">
          <img src="assets/img/emblem-market.webp?v=3.0.0" alt="市集徽章：燈籠" loading="lazy">
          <h3>星際市集</h3><p>交易 · 星砂錢包</p>
        </a>
        <a class="card sys-card" href="pages/duel.html">
          <img src="assets/img/emblem-duel.webp?v=3.0.0" alt="對決徽章：交鋒雙劍" loading="lazy">
          <h3>知識對決</h3><p>與其他旅人一戰</p>
        </a>
        <a class="card sys-card" href="pages/pet.html">
          <img src="assets/img/emblem-pet.webp?v=3.0.0" alt="寵物徽章" loading="lazy">
          <h3>靈獸夥伴</h3><p>孵化 · 陪伴 · 成長</p>
        </a>
        <a class="card sys-card" href="pages/radar.html">
          <img src="assets/img/emblem-radar.webp?v=3.0.0" alt="雷達徽章：星圖" loading="lazy">
          <h3>三維雷達</h3><p>能力星圖 · 比較</p>
        </a>
      </div>
      <div style="margin-top:var(--sp-8);text-align:center">
        <a class="btn btn-ghost" href="pages/settings.html">帳號設定</a>
      </div>
    </main>
  </section>
</div>
<div id="toast-root" aria-live="polite"></div>
<script type="module" src="assets/js/pages/home.js?v=3.0.0"></script>
</body>
</html>
