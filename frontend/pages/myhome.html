<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的家 - 曙光教育</title>
<link rel="stylesheet" href="../assets/css/base.css?v=3.0.0">
<style>
body { background: linear-gradient(180deg, #1a2340 0%, #0B0E2A 100%); color: #EAF6FF; margin: 0; min-height: 100dvh; }
.home-head { padding: 32px 24px 16px; max-width: 800px; margin: 0 auto; text-align: center; }
.home-head a { color: #8B93C9; text-decoration: none; font-size: 14px; }
.home-head h1 { font-size: 36px; margin: 8px 0 4px; }
.home-head p { color: #8B93C9; margin: 0; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 16px 24px 48px; max-width: 800px; margin: 0 auto; }
.home-card { background: #12163A; border: 1px solid #23264F; border-radius: 16px; padding: 24px; }
.home-card h2 { font-size: 18px; margin: 0 0 16px; }
.home-card p { font-size: 14px; color: #8B93C9; margin: 0 0 8px; }
.pet-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #00E5FF; display: block; margin: 0 auto 12px; }
.stat-num { font-size: 36px; font-weight: 800; color: #00E5FF; }
.bar-wrap { background: #23264F; border-radius: 999px; height: 12px; overflow: hidden; }
.bar-fill { background: linear-gradient(90deg, #00E5FF, #7B61FF); height: 100%; border-radius: 999px; transition: width .5s ease; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
input[type=text] { flex: 1; padding: 10px 14px; border: 1px solid #23264F; border-radius: 8px; background: #0B0E2A; color: #EAF6FF; font-size: 14px; }
</style>
</head>
<body>
<div class="home-head">
  <a href="../desktop.html">← 返回首頁</a>
  <h1>我的家</h1>
  <p>你的島嶼，你的歸宿</p>
</div>
<div id="mh-view" class="home-grid">
  <p style="color:#8B93C9;text-align:center;grid-column:1/-1">載入中…</p>
</div>
<script type="module" src="../assets/js/pages/myhome.js?v=3.0.0"></script>
</body>
</html>
