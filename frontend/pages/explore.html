<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>探索冒險 · 曙光教育 3.0</title>
<link rel="stylesheet" href="../assets/css/base.css?v=3.0.0">
<link rel="stylesheet" href="../assets/css/pages/explore.css?v=3.0.0">
</head>
<body class="theme-zen">
<header class="x-header">
  <a class="btn btn-ghost" href="../desktop.html" data-device-home aria-label="回首頁">‹ 首頁</a>
  <img src="../assets/img/emblem-explore.webp?v=3.0.0" alt="探索冒險徽章" class="x-emblem">
  <div>
    <h1>探索冒險</h1>
    <p class="x-sub" id="x-userline">載入中…</p>
  </div>
</header>

<main id="x-main">
  <!-- 三態容器：landing / story / done -->
  <div id="x-view"></div>
</main>

<div id="toast-root" aria-live="polite"></div>
<script type="module" src="../assets/js/pages/explore.js?v=3.0.0"></script>
<script>
  /* 返回鍵：回到記住的裝置版本首頁，而非裝置選擇頁 */
  try {
    var d = localStorage.getItem("dawn.device");
    var link = document.querySelector("[data-device-home]");
    if (link) link.href = (d === "mobile") ? "../mobile.html" : "../desktop.html";
  } catch (e) {}
</script>
</body>
</html>
