<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時通訊｜曙光教育</title>
<style>
body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; }
.topbar .back { font-size: 28px; text-decoration: none; color: #333; }
.container { max-width: 720px; margin: 0 auto; padding: 16px; }
.btn { display: inline-block; padding: 32px 16px; font-size: 18px; font-weight: 800; background: #1a1a1a; color: #fff; border: none; border-radius: 12px; cursor: pointer; text-align: center; }
.btn small { display: block; font-size: 13px; font-weight: 400; opacity: .8; margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; background: #fff; margin-top: 16px; }
input.txt { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.btn-sm { padding: 10px 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<header class="topbar">
  <a href="../desktop.html" class="back">‹</a>
  <h1>即時通訊</h1>
</header>
<main class="container" id="c-view">
  <p>載入中...</p>
</main>
<script>
// 內嵌版：無外部依賴
(function() {
  var view = document.getElementById('c-view');
  var API = 'https://dawn-edu-mvp.onrender.com/api/v1';
  
  function getToken() {
    // 支援多種 token key（相容不同版本的登入）
    try { return localStorage.getItem('dawn:v1:auth-token') || localStorage.getItem('dawn.token') || ''; } catch(e) { return ''; }
  }
  
  function isLoggedIn() { return !!getToken(); }
  
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  
  async function apiGet(path) {
    var res = await fetch(API + path, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!res.ok) throw new Error('API 錯誤: ' + res.status);
    return res.json();
  }
  
  function showLogin() {
    view.innerHTML = '<div style="text-align:center;padding:40px">'
      + '<p>請先登入再使用即時通訊</p>'
      + '<a href="settings.html" class="btn-sm" style="text-decoration:none;display:inline-block">去登入</a></div>';
  }
  
  function showHome() {
    view.innerHTML = '<div class="grid2">'
      + '<button class="btn" id="b-dm">個人聊天<small>輸入對方暱稱即可找到</small></button>'
      + '<button class="btn" id="b-grp">發起群聊<small>建立多人聊天室</small></button>'
      + '</div><div id="form"></div><h3>我的聊天</h3><div id="list"><p>載入中...</p></div>';
    
    document.getElementById('b-dm').onclick = function() {
      document.getElementById('form').innerHTML = '<div class="card"><h3>個人聊天</h3>'
        + '<div style="display:flex;gap:8px"><input class="txt" id="dm-name" placeholder="輸入對方暱稱">'
        + '<button class="btn-sm" id="dm-go">開始</button></div><p id="dm-msg"></p></div>';
      document.getElementById('dm-go').onclick = async function() {
        var name = document.getElementById('dm-name').value.trim();
        var msg = document.getElementById('dm-msg');
        if (!name) { msg.textContent = '請輸入暱稱'; return; }
        msg.textContent = '搜尋中...';
        try {
          var r = await apiGet('/chat/search?name=' + encodeURIComponent(name));
          msg.textContent = r.user ? '找到：' + r.user.name : '找不到用戶';
        } catch(e) { msg.textContent = '失敗：' + e.message; }
      };
    };
    
    document.getElementById('b-grp').onclick = function() {
      document.getElementById('form').innerHTML = '<div class="card"><h3>發起群聊</h3><p>功能開發中...</p></div>';
    };
    
    loadList();
  }
  
  async function loadList() {
    var el = document.getElementById('list');
    try {
      var c = await apiGet('/chat/conversations').catch(function(){ return {conversations:[]}; });
      var g = await apiGet('/chat/groups').catch(function(){ return {groups:[]}; });
      var n = (c.conversations||[]).length + (g.groups||[]).length;
      el.innerHTML = n === 0 ? '<p>還沒有聊天，開始第一個對話吧！</p>' : '<p>共有 ' + n + ' 個聊天</p>';
    } catch(e) { el.innerHTML = '<p>載入失敗</p>'; }
  }
  
  // 啟動
  if (!isLoggedIn()) showLogin(); else showHome();
})();
</script>
</body>
</html>
