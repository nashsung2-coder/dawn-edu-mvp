<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時通訊｜曙光教育</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
.container { max-width: 720px; margin: 0 auto; padding: 16px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0;
  background: var(--bg); z-index: 10; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; }
.topbar .back { font-size: 28px; text-decoration: none; color: var(--text); line-height: 1; }
#c-conv-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.c-conv { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  background: var(--card); cursor: pointer; display: flex; justify-content: space-between; }
.c-conv:hover { border-color: var(--accent); }
#c-chat { border: 1px solid var(--line); border-radius: 16px; background: var(--card);
  display: flex; flex-direction: column; height: 60vh; min-height: 400px; }
#c-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.c-msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
.c-msg.mine { align-self: flex-end; background: var(--accent, #4f8cff); color: #fff;
  border-bottom-right-radius: 4px; }
.c-msg.theirs { align-self: flex-start; background: var(--bg-soft); border-bottom-left-radius: 4px; }
.c-msg .c-time { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
#c-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
#c-input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px;
  font-size: 14px; background: var(--bg); color: var(--text); }
#c-new { margin-bottom: 16px; display: flex; gap: 8px; }
#c-new input { flex: 1; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 14px; }
</style>
</head>
<body>
<header class="topbar">
  <a href="../desktop.html" class="back" aria-label="回首頁">‹</a>
  <h1>即時通訊</h1>
</header>
<main class="container" id="c-view" tabindex="-1"></main>
<script type="module" src="../assets/js/pages/chat.js"></script>
</body>
</html>
