<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學習｜曙光教育</title>
<link rel="stylesheet" href="../assets/css/design-tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--learn-bg); color: var(--learn-text); font-family: var(--learn-font-sans); min-height: 100dvh; line-height: 1.7; }
.wrap { max-width: 760px; margin: 0 auto; padding: 48px 32px 120px; }
/* 頂部 */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; }
.top .back { color: var(--learn-muted); text-decoration: none; font-size: 14px; }
.top .date { font-size: 13px; color: var(--learn-muted); letter-spacing: .05em; }
/* 主標題：襯線大字 */
.hero h1 { font-family: var(--learn-font-serif); font-size: clamp(24px, 4vw, 32px); font-weight: 400; line-height: 1.4; margin-bottom: 12px; }
.hero h1 em { font-style: normal; color: var(--learn-accent); }
.hero .sub { font-size: 15px; color: var(--learn-muted); max-width: 480px; }
/* 今日：大留白 */
.today { margin: 64px 0; padding: 48px 0; border-top: 1px solid var(--learn-line); border-bottom: 1px solid var(--learn-line); }
.today .label { font-size: 12px; letter-spacing: .15em; color: var(--learn-muted); margin-bottom: 24px; text-transform: uppercase; }
.today .cta { display: block; text-decoration: none; color: inherit; }
.today .cta .big { font-family: var(--learn-font-serif); font-size: 28px; margin-bottom: 8px; }
.today .cta .desc { font-size: 14px; color: var(--learn-muted); }
.today .cta:hover .big { color: var(--learn-accent); }
/* 數據：極簡 */
.stats { display: flex; gap: 48px; margin: 48px 0; }
.stat .num { font-family: var(--learn-font-serif); font-size: 36px; }
.stat .lbl { font-size: 12px; color: var(--learn-muted); letter-spacing: .08em; margin-top: 4px; }
/* 功能：文字列表，非卡片 */
.sec { margin: 64px 0; }
.sec h2 { font-family: var(--learn-font-serif); font-size: 22px; font-weight: 400; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--learn-line); }
.func { display: block; padding: 20px 0; border-bottom: 1px solid var(--learn-line); text-decoration: none; color: inherit; transition: padding-left .2s ease; }
.func:hover { padding-left: 12px; }
.func .t { font-size: 17px; font-weight: 600; }
.func .d { font-size: 14px; color: var(--learn-muted); margin-top: 4px; }
.func .arrow { float: right; color: var(--learn-muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../desktop.html">‹ 返回</a>
    <span class="date" id="l-date"></span>
  </div>
  <div class="hero">
    <h1>今天想<em>學點什麼？</em></h1>
    <p class="sub">題目是新聞標題，引發你的好奇；真正的學習，從你提出第一個問題開始。</p>
  </div>
  <div class="today">
    <div class="label">Today</div>
    <a class="cta" href="quiz.html" id="l-cta">
      <div class="big" id="l-cta-title">開始今日學習</div>
      <div class="desc" id="l-cta-desc">從一個問題出發</div>
    </a>
  </div>
  <div class="stats" id="l-stats">
    <div class="stat"><div class="num" id="s-review">–</div><div class="lbl">待複習</div></div>
    <div class="stat"><div class="num" id="s-points">–</div><div class="lbl">星砂</div></div>
    <div class="stat"><div class="num" id="s-streak">–</div><div class="lbl">連續天數</div></div>
  </div>
  <div class="sec">
    <h2>學習方式</h2>
    <div id="l-funcs"></div>
  </div>
</div>
<script src="../assets/js/core/nav.js"></script>
<script type="module">
import { get } from "../core/api.js";
import { isLoggedIn } from "../core/auth.js";
// 日期
document.getElementById('l-date').textContent = new Date().toLocaleDateString('zh-TW', {month:'long', day:'numeric', weekday:'long'});
// 功能列表
const funcs = [
  { href: 'quiz.html', t: '費曼戰役', d: '用自己的話說服 AI，真正理解才算過關' },
  { href: 'duel.html', t: '知識對決', d: '與他人一較高下，在競爭中學習' },
  { href: 'review.html', t: '複習', d: 'SM-2 間隔重複，記得更牢' },
  { href: 'explore.html', t: '圖書館探索', d: '閱讀與提問，解鎖知識武器' },
  { href: 'library.html', t: '知識庫', d: '建立你的知識網絡' },
];
document.getElementById('l-funcs').innerHTML = funcs.map(f =>
  `<a class="func" href="${f.href}"><span class="arrow">→</span><div class="t">${f.t}</div><div class="d">${f.d}</div></a>`
).join('');
// 數據
if (isLoggedIn()) {
  get('/dashboard').then(d => {
    document.getElementById('s-review').textContent = d.due_review ?? 0;
    document.getElementById('s-points').textContent = d.points ?? 0;
    document.getElementById('s-streak').textContent = d.streak ?? 0;
    if ((d.due_review ?? 0) > 0) {
      document.getElementById('l-cta-title').textContent = `複習 ${d.due_review} 個知識點`;
      document.getElementById('l-cta-desc').textContent = '記憶需要及時鞏固';
      document.getElementById('l-cta').href = 'review.html';
    }
  }).catch(() => {});
} else {
  document.getElementById('l-stats').style.display = 'none';
}
</script>
</body>
</html>
