}

.console-card img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; display: block; border: 2px solid #E2D9C8; }
.console-card h3 { font-size: 16px; margin: 0 0 4px; }
.console-card p { font-size: 12px; color: #8A8175; margin: 0; }
