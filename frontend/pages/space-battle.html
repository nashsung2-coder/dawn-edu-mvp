<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太空對戰 - 曙光教育</title>
<link rel="stylesheet" href="../assets/css/base.css?v=3.0.0">
<style>
body { background: #050510; color: #EAF6FF; margin: 0; overflow: hidden; }
#bt-wrap { position: fixed; inset: 0; }
#bt-canvas { display: block; width: 100%; height: 100%; }
#bt-hud { position: fixed; top: 0; left: 0; right: 0; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
#bt-score { font-size: 16px; font-weight: 700; color: #00E5FF; }
.hp-bar { width: 180px; }
.hp-bar .name { font-size: 13px; margin-bottom: 4px; }
.hp-bar .track { background: #23264F; border-radius: 999px; height: 12px; overflow: hidden; }
.hp-bar .fill { height: 100%; border-radius: 999px; transition: width .3s ease; background: #00E5FF; }
#bt-log { position: fixed; top: 70px; right: 12px; width: 220px; max-height: 40vh; overflow-y: auto; font-size: 12px; color: #8B93C9; z-index: 10; }
#bt-actions { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; display: flex; gap: 12px; justify-content: center; z-index: 10; background: rgba(11,14,42,.9); }
.btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.btn-primary { background: #00E5FF; color: #050510; font-weight: 700; }
.btn-ghost { background: transparent; color: #8B93C9; border: 1px solid #333; }
#sp-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 20; }
</style>
</head>
<body>
<div id="bt-wrap"><canvas id="bt-canvas"></canvas></div>
<div id="bt-hud">
  <div class="hp-bar"><div class="name">我</div><div class="track"><div class="fill" id="bt-p1-hp" style="width:100%"></div></div></div>
  <div id="bt-score">分數 0 · 第 1/5 波</div>
  <a href="space.html" style="color:#8B93C9;text-decoration:none;font-size:13px">✕ 離開</a>
</div>
<div id="bt-log"></div>
<div id="bt-actions">
  <button class="btn btn-primary" id="bt-multiplayer" style="opacity:.5">多人連機（開發中）</button>
  <div style="color:#8B93C9;font-size:13px;align-self:center">WASD 移動 · 空白鍵射擊 · 點擊射擊</div>
</div>
<div id="sp-toast" hidden></div>
<script src="../assets/js/pages/space-battle.js?v=4.0.0"></script>
<script src="../assets/js/core/nav.js"></script>
</body>
</html>
