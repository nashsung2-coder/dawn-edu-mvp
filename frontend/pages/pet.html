<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靈獸小屋 · 曙光教育 3.0</title>

<body class="theme-zen">
<header class="p-header">

  <img src="../assets/img/emblem-pet.webp?v=3.0.0" alt="靈獸徽章" class="p-emblem">
  <div>

<div id="toast-root" aria-live="polite"></div>
<script type="module" src="../assets/js/pages/pet.js?v=3.0.0"></script>
<script>
  /* 返回鍵：回到記住的裝置版本首頁，而非裝置選擇頁 */
  try {
    var d = localStorage.getItem("dawn.device");
    var link = document.querySelector("[data-device-home]");
    if (link) link.href = (d === "mobile") ? "../mobile.html" : "../desktop.html";
  } catch (e) {}
</script>
