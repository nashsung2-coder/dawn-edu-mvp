<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊戲｜曙光教育</title>
<link rel="stylesheet" href="../assets/css/design-tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--game-bg); color: var(--game-text); font-family: -apple-system, "Noto Sans TC", sans-serif; min-height: 100dvh; overflow-x: hidden; }
/* 星空背景 */
.stars { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 60% 70%, #fff, transparent),
    radial-gradient(2px 2px at 80% 20%, #00E5FF, transparent),
    radial-gradient(1px 1px at 40% 80%, #fff, transparent);
  opacity: .4; }
.wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 20px 120px; }
.back { color: var(--game-muted); text-decoration: none; font-size: 14px; }
/* HUD：更有遊戲感 */
.hud { display: flex; gap: 16px; align-items: center; background: linear-gradient(135deg, #141842, #1E2460); border: 1px solid var(--game-line); border-radius: 16px; padding: 20px; margin: 20px 0; box-shadow: var(--game-glow); }
.hud .avatar { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--game-accent), var(--game-accent-2)); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; }
.hud .info { flex: 1; }
.hud .name { font-weight: 900; font-size: 18px; }
.hud .sub { font-size: 12px; color: var(--game-muted); }
.hud .res { text-align: right; }
.hud .res .num { font-size: 24px; font-weight: 900; color: #ffd97a; text-shadow: 0 0 12px rgba(255,217,122,.5); }
/* 大按鈕：未知之境 */
.hero-btn { display: block; text-decoration: none; color: inherit; background: linear-gradient(135deg, #1E2460, #2A3380); border: 2px solid var(--game-accent); border-radius: 20px; padding: 32px 24px; margin: 24px 0; text-align: center; box-shadow: var(--game-glow); transition: transform .2s ease; }
.hero-btn:hover { transform: scale(1.02); }
.hero-btn h2 { font-size: 28px; font-weight: 900; margin-bottom: 8px; background: linear-gradient(90deg, var(--game-accent), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero-btn p { color: var(--game-muted); font-size: 14px; }
/* 遊戲卡片網格 */
.sec-title { font-size: 14px; font-weight: 800; letter-spacing: .15em; color: var(--game-muted); margin: 32px 0 16px; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.gcard { display: block; background: var(--game-bg-soft); border: 1px solid var(--game-line); border-radius: var(--game-radius); padding: 24px 16px; text-align: center; text-decoration: none; color: inherit; transition: all .2s ease; }
.gcard:hover { transform: translateY(-4px); border-color: var(--game-accent); box-shadow: var(--game-glow); }
.gcard .ico { font-size: 36px; margin-bottom: 12px; }
.gcard h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.gcard p { font-size: 12px; color: var(--game-muted); }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <a class="back" href="../desktop.html">‹ 返回</a>
  <div class="hud" id="g-hud">
    <div class="avatar" id="g-avatar">?</div>
    <div class="info"><div class="name" id="g-name">載入中...</div><div class="sub" id="g-sub"></div></div>
    <div class="res"><div class="num" id="g-points">–</div><div class="sub">星砂</div></div>
  </div>
  <a class="hero-btn" href="space.html">
    <h2>未知之境</h2>
    <p>開飛船探索宇宙 · 降落星球挑戰關卡 · 與其他玩家對戰</p>
  </a>
  <div class="sec-title">Battle</div>
  <div class="grid">
    <a class="gcard" href="duel.html"><img src="../assets/img/emblem-duel.webp" alt="" style="width:48px;height:48px;border-radius:12px;object-fit:cover;margin-bottom:12px"><h3>知識對決</h3><p>即時 PK</p></a>
    <a class="gcard" href="island.html"><img src="../assets/img/emblem-island.webp" alt="" style="width:48px;height:48px;border-radius:12px;object-fit:cover;margin-bottom:12px"><h3>領地爭奪</h3><p>擴張版圖</p></a>
  </div>
  <div class="sec-title">Market</div>
  <div class="grid">
    <a class="gcard" href="market.html"><img src="../assets/img/emblem-market.webp" alt="" style="width:48px;height:48px;border-radius:12px;object-fit:cover;margin-bottom:12px"><h3>市集</h3><p>交易武器</p></a>
    <a class="gcard" href="pet.html"><img src="../assets/img/emblem-pet.webp" alt="" style="width:48px;height:48px;border-radius:12px;object-fit:cover;margin-bottom:12px"><h3>靈獸</h3><p>培養夥伴</p></a>
  </div>
</div>
<script src="../assets/js/core/nav.js"></script>
<script type="module">
import { supabase, getUser } from "../core/supabase.js";
import { isLoggedIn } from "../core/auth.js";
if (isLoggedIn()) {
  (async () => {
    try {
      const user = await getUser();
      if (!user) throw new Error("no user");
      const { data: profile } = await supabase.from("profiles").select("name, points").eq("id", user.id).single();
      const name = profile?.name || '玩家';
      document.getElementById('g-name').textContent = name;
      document.getElementById('g-avatar').textContent = name[0];
      document.getElementById('g-points').textContent = profile?.points ?? 0;
    } catch (e) {
      document.getElementById('g-name').textContent = '玩家';
      document.getElementById('g-points').textContent = 0;
    }
  })();
} else {
  document.getElementById('g-hud').innerHTML = '<div style="text-align:center;width:100%"><a href="settings.html" style="color:#00E5FF">登入以查看角色資訊</a></div>';
}
</script>
</body>
</html>
