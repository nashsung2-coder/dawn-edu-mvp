# Render Blueprint — 曙光教育智能系統 MVP 後端
# 用法：Render Dashboard → New → Blueprint → 選擇此 repo，Render 會自動建立服務。
# 之後在 Dashboard 把 DATABASE_URL、FRONTEND_URL 填上即可。
services:
  - type: web
    name: dawn-edu-mvp
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # 部署時手動填 Neon 的連線字串（建議用 pooled）
      - key: FRONTEND_URL
        sync: false # 部署時手動填 Cloudflare Pages 網址，可多個（逗號分隔）
